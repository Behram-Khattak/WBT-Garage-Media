kind = "web"
previewPath = "/"
title = "WBT Garage"
version = "1.0.0"
id = "artifacts/wbt-garage"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21406

[services.development]
run = "pnpm --filter @workspace/wbt-garage run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wbt-garage", "run", "build" ]
publicDir = "artifacts/wbt-garage/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21406"
BASE_PATH = "/"
